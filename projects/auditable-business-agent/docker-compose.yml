services:
  database:
    image: pgvector/pgvector:pg16
    container_name: auditable-business-agent-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-auditable_agent}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - auditable_agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auditable-business-agent-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent_dev_only}@database:5432/${POSTGRES_DB:-auditable_agent}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  auditable_agent_pgdata:
