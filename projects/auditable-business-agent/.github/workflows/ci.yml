name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    defaults:
      run:
        working-directory: projects/auditable-business-agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/auditable-business-agent/frontend/package-lock.json
      - run: uv sync --frozen
      - run: npm ci
        working-directory: projects/auditable-business-agent/frontend
      - run: npm run build
        working-directory: projects/auditable-business-agent/frontend
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python evals/run_golden_cases.py
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - run: until curl -fsS http://127.0.0.1:8000/health; do sleep 2; done
      - run: uv run --env-file .env python scripts/seed_e2e_users.py
      - run: uv run --env-file .env python evals/run_retrieval_eval.py --provider local --k 1 --min-recall 0.65 --output retrieval-local.json
      - run: uv run --env-file .env python evals/run_retrieval_eval.py --provider bge --k 1 --min-recall 0.91 --output retrieval-bge.json
      - run: npx playwright install --with-deps chromium
        working-directory: projects/auditable-business-agent/frontend
      - run: npm run test:e2e
        working-directory: projects/auditable-business-agent/frontend
      - name: Evaluate OpenAI embeddings when configured
        if: ${{ env.OPENAI_API_KEY != '' }}
        env:
          EMBEDDING_API_KEY: ${{ env.OPENAI_API_KEY }}
          RAG_EMBEDDING_PROVIDER: openai
        run: uv run python evals/run_retrieval_eval.py --provider openai --k 1 --min-recall 0.8 --output retrieval-openai.json
      - name: Upload retrieval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-reports
          path: projects/auditable-business-agent/retrieval-*.json
          if-no-files-found: ignore
      - name: Upload browser report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: projects/auditable-business-agent/frontend/playwright-report
          if-no-files-found: ignore
      - name: Print API logs on failure
        if: failure()
        run: docker compose logs api
