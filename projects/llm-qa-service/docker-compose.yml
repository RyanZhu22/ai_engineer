services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: llm-qa-pg
    environment:
      POSTGRES_USER: llmqa
      POSTGRES_PASSWORD: llmqa_dev_only
      POSTGRES_DB: llmqa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmqa -d llmqa"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
